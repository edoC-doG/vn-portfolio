/* Layout: one reading column; experience drawn as a river line with a lantern dot on the current role. */
:root {

@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {
  --bg: #0D1718; --surface: #132123; --ink: #E6EEEC; --muted: #93A6A5;

}
* { box-sizing: border-box; }
body {

}
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line); }
a:hover { text-decoration-color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -16px; padding: 10px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar-inner { max-width: 46rem; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mono-mark { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; }
.mono-mark span { color: var(--accent); }
.bar-tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button {
  border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg svg { width: 12px; height: 14px; }

.note3d { max-width: 46rem; margin: 10px auto 0; font-size: 13px; color: var(--muted); }
.note3d[hidden] { display: none !important; }

main { max-width: 46rem; margin: 0 auto; }
.intro { padding-block: 40px 8px; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.02; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.role { font-size: 1.1rem; font-weight: 500; margin: 8px 0 0; }
.contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 16px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.contact li { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.copy-btn {

.email-text { color: var(--ink); user-select: all; overflow-wrap: anywhere; }

.summary { margin: 20px 0 0; max-width: 62ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 24px 0 0; border-block: 1px solid var(--line); }
.facts div { padding: 12px 14px 12px 0; min-width: 0; }

section { padding-top: 36px; }
h2 {

h2::after { content: ""; flex: 1; height: 1px; background: var(--line); transform: translateY(-4px); }

.river { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; display: grid; gap: 22px; }
.river::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line); border-radius: 2px; }
.river li { position: relative; }
.river li::before {

  background: var(--bg); border: 2px solid var(--muted);

.river li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

.row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.row-head h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.when { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.desc { margin: 6px 0 0; }

.projects { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; }
.projects ul { margin: 6px 0 0; padding-left: 18px; }
.projects ul li { margin: 3px 0; }
.projects ul li::marker { color: var(--accent); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.tags li { font-family: var(--font-mono); font-size: 11.5px; padding: 1px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }

.skills { margin: 0; display: grid; gap: 10px; }
.skills div { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 12px; }
.skills dt { font-weight: 600; font-size: 14px; }
.skills dd { margin: 0; font-size: 14px; color: var(--ink); }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.plain h3 { margin: 0; font-size: 15px; font-weight: 600; }

footer { max-width: 46rem; margin: 48px auto 0; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }

.toast {

@media (max-width: 640px) {

  .facts div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }

  .when { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .seg button { transition: background .15s, color .15s; }
}
</style>

const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let lang = "vi";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(ym) {
  const [y, m] = ym.split("-").map(Number);
  return lang === "vi" ? `${String(m).padStart(2, "0")}/${y}` : `${MONTHS_EN[m - 1]} ${y}`;
}
function range(from, to) {
  return `${fmt(from)} – ${to ? fmt(to) : DATA[lang].ui.present}`;
}

    </section>

    <section aria-labelledby="h-proj">
      <h2 id="h-proj">${esc(u.proj)}</h2>
      <ul class="projects">
        ${d.proj.map(p => `
          <li>
            <div class="row-head"><h3>${esc(p.name)}</h3><span class="when">${range(p.from, p.to)}</span></div>
            <p class="sub">${esc(p.role)}</p>
            <ul>${p.points.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
            <ul class="tags">${p.tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
          </li>`).join("")}
      </ul>
    </section>

    <section aria-labelledby="h-skills">
      <h2 id="h-skills">${esc(u.skills)}</h2>
      <dl class="skills">
        ${d.skills.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}
      </dl>
    </section>

    <section class="two">
      <div>
        <h2>${esc(u.edu)}</h2>
        <ul class="plain">${d.edu.map(e => `
          <li><h3>${esc(e.name)}</h3><p class="sub">${esc(e.sub)}</p><span class="when">${range(e.from, e.to)}</span></li>`).join("")}
        </ul>
      </div>
      <div>
        <h2>${esc(u.cert)}</h2>
        <ul class="plain">${d.cert.map(c => `
          <li><h3>${esc(c.name)}</h3><p class="sub">${esc(c.sub)} · <span class="when">${fmt(c.date)}</span></p></li>`).join("")}
        </ul>
      </div>
    </section>`;
  document.getElementById("foot").textContent = u.footer;
  document.getElementById("copy-email").addEventListener("click", copyEmail);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function selectEmail() {
  const el = document.getElementById("email-text");
  const r = document.createRange(); r.selectNodeContents(el);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function copyEmail() {
  const u = DATA[lang].ui;
  try {
    navigator.clipboard.writeText(DATA.email).then(() => toast(u.copied), () => { selectEmail(); toast(u.copyFail); });
  } catch (e) { selectEmail(); toast(u.copyFail); }
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("cv-lang", l); } catch (e) {}
  render();
}

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("cv-lang"); } catch (e) {}
  const hash = (location.hash || "").replace("#", "");
  if (hash === "en" || hash === "vi") lang = hash;
  else if (saved === "en" || saved === "vi") lang = saved;
  else lang = (navigator.language || "").toLowerCase().startsWith("vi") ? "vi" : "en";
  render();
  document.getElementById("lang-vi").addEventListener("click", () => setLang("vi"));
  document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
  document.getElementById("btn-3d").addEventListener("click", () => {
    const n = document.getElementById("note3d"); n.hidden = !n.hidden;
  });
})();
</script>
